<script>
const $=i=>document.getElementById(i),T=THREE,R=Math.random,MT=c=>new T.MeshLambertMaterial({color:c});
const LOW='ontouchstart' in window||navigator.maxTouchPoints>0;
const sc=new T.Scene();sc.background=new T.Color(0x9fd0ff);sc.fog=new T.Fog(0x9fd0ff,LOW?30:50,LOW?85:160);
const cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,.1,LOW?90:260);sc.add(cam);
const rd=new T.WebGLRenderer({antialias:!LOW,powerPreference:'high-performance'});rd.setPixelRatio(LOW?1:Math.min(devicePixelRatio,1.5));rd.setSize(innerWidth,innerHeight);document.body.appendChild(rd.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight)});
sc.add(new T.HemisphereLight(0xffffff,0x557755,1));const sun=new T.DirectionalLight(0xffffff,.6);sun.position.set(30,50,20);sc.add(sun);
function box(w,h,d,c,x,y,z,p=sc){const m=new T.Mesh(new T.BoxGeometry(w,h,d),MT(c));m.position.set(x,y,z);p.add(m);return m}
function tex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return new T.CanvasTexture(c)}
function sign(w,h,txt,bg,fg,x,y,z,ry,fs){const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({side:2,map:tex(512,Math.round(512*h/w),(g,W,H)=>{g.fillStyle=bg;g.fillRect(0,0,W,H);g.fillStyle=fg;g.font='bold '+fs+'px sans-serif';g.textAlign='center';g.textBaseline='middle';txt.split('|').forEach((t,i,a)=>g.fillText(t,W/2,H*(i+1)/(a.length+1)))})}));m.position.set(x,y,z);m.rotation.y=ry;sc.add(m);return m}

// ---------- карта ----------
const XA=-45,XB=165,MZ=135,W=[];// коллайдеры [x,z,полуширина,полуглубина]
box(300,.1,330,0x3f8f3f,60,-.05,0);
// дорога-кольцо: две прямые по 120 м (x=0 и x=120) и две полуокружности радиусом 60 м
const RW=120,RR=60,RS=60,LTOT=2*RW+2*Math.PI*RR;
function pathAt(s){s=(s%LTOT+LTOT)%LTOT;
 if(s<RW)return[0,RS-s,0];s-=RW;
 if(s<Math.PI*RR){const f=Math.PI-s/RR;return[RR+RR*Math.cos(f),-RS-RR*Math.sin(f),f+Math.PI]}s-=Math.PI*RR;
 if(s<RW)return[120,-RS+s,Math.PI];s-=RW;
 const f=s/RR;return[RR+RR*Math.cos(f),RS+RR*Math.sin(f),Math.PI-f]}
const PP=[];for(let s=0;s<LTOT;s+=5){const q=pathAt(s);PP.push([q[0],q[1]])}
const roadDist=(x,z)=>{let d=1e9;for(const p of PP){const q=Math.hypot(x-p[0],z-p[1]);if(q<d)d=q}return d};
box(12,.05,120,0x333333,0,.02,0);box(12,.05,120,0x333333,120,.02,0);
for(const[z0,t0]of[[-RS,0],[RS,Math.PI]]){const m=new T.Mesh(new T.RingGeometry(54,66,64,1,t0,Math.PI),MT(0x333333));m.rotation.x=-Math.PI/2;m.position.set(60,.02,z0);sc.add(m)}
{const nd=Math.floor(LTOT/7),im=new T.InstancedMesh(new T.BoxGeometry(.25,.03,3),MT(0xffffff),nd),d=new T.Object3D();
 for(let i=0;i<nd;i++){const q=pathAt(i*7);d.position.set(q[0],.05,q[1]);d.rotation.y=q[2];d.updateMatrix();im.setMatrixAt(i,d.matrix)}sc.add(im)}
// заправки, деревья и автобус появляются из моделей (см. «загрузка моделей»)
function totem(x,name,bg){box(.5,7,.5,0x999999,x,3.5,-17);W.push([x,-17,.3,.3]);for(const q of[0,Math.PI])sign(4.6,3.6,name+'|СПИРТ 24ч',bg,'#fff',x,8.2,-17+(q?-.05:.05),q,70)}
totem(-7.5,'ГАЗПРОМ','#0a5fb4');totem(7.5,'ЛУКОЙЛ','#d7141a');
for(let i=0;i<(LOW?30:46);i++){let x,z;do{x=XA+10+R()*(XB-XA-20);z=-(MZ-8)+R()*2*(MZ-8)}while(roadDist(x,z)<14||(x<32&&Math.abs(z)<32));const w=2+R()*2,h=1.5+R()*1.5;box(w,h,w,0x8a5a2b,x,h/2,z);W.push([x,z,w/2,w/2])}
const tt=tex(512,128,(x,w,h)=>{x.fillStyle='#244f24';x.fillRect(0,0,w,h);for(let i=0;i<90;i++){x.fillStyle=`hsl(${95+R()*35},50%,${12+R()*22}%)`;const a=R()*w,b=R()*h;x.beginPath();x.moveTo(a,b-45);x.lineTo(a-24,b+30);x.lineTo(a+24,b+30);x.fill()}});
tt.wrapS=T.RepeatWrapping;tt.repeat.set(9,1);
for(const z of[-(MZ+14),MZ+14]){const p=new T.Mesh(new T.PlaneGeometry(270,32),new T.MeshBasicMaterial({map:tt}));p.position.set(60,15,z);if(z>0)p.rotation.y=Math.PI;sc.add(p)}
function col(o,rad=.5){for(const[w,z,a,b]of W){const dx=o.x-w,dz=o.z-z,px=a+rad-Math.abs(dx),pz=b+rad-Math.abs(dz);if(px>0&&pz>0){if(px<pz)o.x+=dx>0?px:-px;else o.z+=dz>0?pz:-pz}}
 o.x=Math.max(XA,Math.min(XB,o.x));o.z=Math.max(-MZ,Math.min(MZ,o.z))}// невидимый барьер

// ---------- бутылки СПИРТ ----------
const lab=tex(256,128,(x,w,h)=>{x.fillStyle='#1fa34a';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.fillRect(0,34,w,60);x.fillStyle='#d00';x.font='bold 40px sans-serif';x.textAlign='center';x.fillText('СПИРТ',w/2,80)});
const bots_=[];
function rp(){let x,z,ok;do{x=XA+4+R()*(XB-XA-8);z=-(MZ-4)+R()*2*(MZ-4);ok=W.every(([a,b,c,d])=>Math.abs(x-a)>c+1||Math.abs(z-b)>d+1)}while(!ok);return[x,z]}
for(let i=0;i<(LOW?30:60);i++){const g=new T.Group(),b=new T.Mesh(new T.CylinderGeometry(.14,.14,.45,12),new T.MeshLambertMaterial({map:lab}));
 const n=new T.Mesh(new T.CylinderGeometry(.05,.1,.25,8),MT(0x1fa34a));n.position.y=.33;const cp=new T.Mesh(new T.CylinderGeometry(.06,.06,.06,8),MT(0xffdd00));cp.position.y=.48;
 g.add(b,n,cp);g.scale.setScalar(1.7);const[x,z]=rp();g.position.set(x,.8,z);sc.add(g);bots_.push(g)}

// ---------- модели ----------
function boxGun(t){const g=new T.Group();
 if(t){box(.07,.1,.9,0x111111,0,0,0,g);box(.06,.14,.2,0x111111,0,.1,.1,g);box(.06,.22,.08,0x222222,0,-.15,-.05,g);box(.07,.1,.3,0x111111,0,-.02,.55,g)}
 else{box(.07,.1,.8,0x2b2b2b,0,0,0,g);box(.08,.1,.3,0x8a5a2b,0,-.01,.5,g);box(.08,.1,.3,0x8a5a2b,0,0,-.3,g);box(.06,.22,.09,0x333333,0,-.17,-.05,g).rotation.x=.3}
 return g}
// модели оружия: сами подгоняются по размеру/повороту; если не загрузились – остаются коробки
const MD={0:{u:'models/ak74.glb',L:.9,f:1},1:{u:'models/m16.glb',L:.9,f:0}},GM={};// f:1 – развернуть ствол
function norm(src,L,flip){const root=src.clone(true),A=new T.Group(),B=new T.Group(),C=new T.Group(),O=new T.Group(),W=new T.Group();
 const b=new T.Box3().setFromObject(root),s=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3());root.position.sub(c);A.add(root);
 if(s.x>=s.y&&s.x>=s.z)A.rotation.y=Math.PI/2;else if(s.y>s.z)A.rotation.x=Math.PI/2;
 B.add(A);B.updateMatrixWorld(true);const s2=new T.Box3().setFromObject(B).getSize(new T.Vector3());if(s2.x>s2.y*1.2)B.rotation.z=Math.PI/2;
 C.add(B);if(flip)C.rotation.y=Math.PI;O.add(C);O.scale.setScalar(L/Math.max(s.x,s.y,s.z));W.add(O);return W}
function gun(t,fp){return GM[t]?norm(GM[t],MD[t].L,MD[t].f):boxGun(t)}// тяжёлую модель на телефонах показываем только от первого лица
function addGun(g,t){const w=gun(t,0);w.position.set(.38,1,-.45);g.add(w);g.userData.w=w}
function mk(t){const g=new T.Group(),c=t?0xffa6c0:0xffffff,b=new T.Mesh(new T.SphereGeometry(.5,12,10),MT(c));b.scale.set(1,1.1,1.15);b.position.y=.8;g.add(b);
 const h=new T.Mesh(new T.SphereGeometry(.28,10,8),MT(c));h.position.set(0,1.5,-.2);g.add(h);
 box(.06,.06,.04,0,-.12,1.58,-.43,g);box(.06,.06,.04,0,.12,1.58,-.43,g);
 box(.12,.45,.12,t?0xff8fb0:0xffaa00,-.2,.22,0,g);box(.12,.45,.12,t?0xff8fb0:0xffaa00,.2,.22,0,g);
 if(t){const s=new T.Mesh(new T.CylinderGeometry(.12,.12,.14,10),MT(0xff7a9c));s.rotation.x=Math.PI/2;s.position.set(0,1.45,-.5);g.add(s);
  for(const x of[-.18,.18]){const e=new T.Mesh(new T.ConeGeometry(.09,.2,4),MT(0xff8fb0));e.position.set(x,1.8,-.2);g.add(e)}}
 else{const be=new T.Mesh(new T.ConeGeometry(.08,.25,6),MT(0xffaa00));be.rotation.x=-Math.PI/2;be.position.set(0,1.48,-.5);g.add(be);box(.06,.16,.26,0xdd1111,0,1.82,-.2,g);box(.05,.12,.05,0xdd1111,0,1.3,-.5,g)}
 addGun(g,t);return g}

// ---------- звук ----------
let ac;const A=()=>ac=ac||new(window.AudioContext||webkitAudioContext)();
function noise(d,f,g){const a=A(),n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(R()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const gn=a.createGain();gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(a.destination);s.start()}
function tone(ty,f1,f2,d,g){const a=A(),o=a.createOscillator(),gn=a.createGain(),t=a.currentTime;o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(a.destination);o.start();o.stop(t+d)}
const S={ak:v=>{noise(.13,1800,.5*v);tone('square',140,40,.1,.25*v)},m16:v=>{noise(.09,3600,.4*v);tone('square',230,70,.07,.18*v)},
 pick:()=>tone('sine',900,1700,.12,.2),hurt:()=>tone('sawtooth',300,80,.2,.25),hit:()=>tone('square',500,250,.05,.15),
 cluck:v=>[0,100,200,330].forEach(t=>setTimeout(()=>tone('square',650+R()*350,380,.08,.12*v),t)),oink:v=>tone('sawtooth',260,100,.4,.25*v)};
const vol=(x,z)=>Math.max(0,1-Math.hypot(x-me.x,z-me.z)/70);

// ---------- состояние ----------
const me={team:0,hp:100,x:0,y:0,z:0,vy:0,yaw:0,pit:0,k:0,b:0,cd:0,sent:0,dead:0};
let ws,on=0,myId=0,playing=0,locked=0,md=0,fg,rec=0,fd=[];const keys={},P={},bots=[],tr=[];
const ents=()=>Object.values(P).concat(bots),send=o=>ws&&on&&ws.readyState===1&&ws.send(JSON.stringify(o));
const feed=s=>{fd.push(s);fd=fd.slice(-5);$('k').innerHTML=fd.join('<br>')};
const spp=t=>[(t?1:-1)*(7+R()*3),(R()-.5)*30];
function spawn(e){[e.x,e.z]=spp(e.team);e.yaw=e.team?Math.PI/2:-Math.PI/2;e.y=0;e.vy=0}
function ent(team,id){const e={g:mk(team),team,id,tx:0,ty:0,tz:0,r:0,alive:1,hp:100};sc.add(e.g);return e}
function mkBots(){const n=LOW?4:8;for(let t=0;t<2;t++)for(let i=0;i<n;i++){const e=ent(t,'b'+t+i);Object.assign(e,{bot:1,cd:R(),rt:0,b:20+(R()*25|0),mode:'foot',wp:null,wt:0,av:0,ad:1,ph:R()*6,lt:.7,lx:0,lz:0,car:null,hc:0,sq:0});const[x,z]=respawnPos();e.g.position.set(x,0,z);bots.push(e)}}
const TM=new T.LineBasicMaterial({color:0xffee66});
function tracer(o,d,l){const g=new T.BufferGeometry().setFromPoints([o,o.clone().addScaledVector(d,l)]),m=new T.Line(g,TM);sc.add(m);tr.push([m,.06])}
function hurt(d,by){if(me.dead||!playing)return;me.hp-=d;S.hurt();document.body.style.boxShadow='inset 0 0 150px red';setTimeout(()=>document.body.style.boxShadow='',120);
 if(me.hp<=0){me.dead=3;me.b=me.b>>1;const n=(me.team?'🐖':'🐔')+(myId||'');feed(n+' убит');send({t:'d',by,n:n+' убит',team:me.team});(me.team?S.oink:S.cluck)(1)}}
function botHit(b,d,byMe,killer){b.hp-=d;if(b.hp<=0){b.alive=0;b.g.visible=false;b.rt=3;b.mode='foot';b.b=b.b>>1;if(killer)killer.b+=3;(b.team?S.oink:S.cluck)(vol(b.g.position.x,b.g.position.z));if(byMe){me.k++;me.b+=3;feed('Ты убил бота +3🍾')}}}
function buy(){if(me.b>=5&&me.hp<100&&!me.dead){me.b-=5;me.hp=Math.min(100,me.hp+50);S.pick()}}
function fire(){me.cd=me.team?.09:.1;const d=new T.Vector3(-Math.sin(me.yaw)*Math.cos(me.pit),Math.sin(me.pit),-Math.cos(me.yaw)*Math.cos(me.pit));
 d.x+=(R()-.5)*.02;d.y+=(R()-.5)*.02;d.normalize();const o=new T.Vector3(me.x,me.y+1.6,me.z);let best=80,tg=null;
 for(const e of ents()){if(e.team===me.team||!e.alive)continue;const c=e.g.position,ox=c.x-o.x,oy=c.y+.9-o.y,oz=c.z-o.z,t=ox*d.x+oy*d.y+oz*d.z;if(t<0||t>best)continue;if(ox*ox+oy*oy+oz*oz-t*t<.5){best=t;tg=e}}
 tracer(o.clone().add(new T.Vector3(0,-.25,0)),d,best);send({t:'s',o:[o.x,o.y-.25,o.z],d:[d.x,d.y,d.z],w:me.team});S[me.team?'m16':'ak'](1);rec=.08;
 if(tg){S.hit();const dm=me.team?22:25;tg.bot?botHit(tg,dm,1):send({t:'hit',to:tg.id,d:dm})}}

// ---------- сеть ----------
function net(){if(location.protocol==='file:'||!location.host){$('s0').textContent='Офлайн-режим: боты (для сети запусти server.js)';return}
 try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host)}catch(e){return}
 ws.onopen=()=>{on=1;$('s0').textContent='🟢 Онлайн: подключено'};
 ws.onclose=ws.onerror=()=>{if(!on)$('s0').textContent='Офлайн-режим: боты'};
 ws.onmessage=e=>{const o=JSON.parse(e.data);
  if(o.t==='id')myId=o.id;
  else if(o.t==='p'){const p=P[o.id]||(P[o.id]=ent(o.team,o.id));p.tx=o.x;p.ty=o.y;p.tz=o.z;p.r=o.r;p.alive=o.a;p.v=o.v;p.c=o.c;if(p.g.position.lengthSq()===0)p.g.position.set(o.x,o.y,o.z)}
  else if(o.t==='s'){const D=new T.Vector3(...o.d);tracer(new T.Vector3(...o.o),D,60);S[o.w?'m16':'ak'](vol(o.o[0],o.o[2]))}
  else if(o.t==='hit')hurt(o.d,o.id)
  else if(o.t==='d'){feed(o.n);if(o.by===myId&&myId){me.k++;me.b+=3;feed('Ты убил игрока +3🍾')}if(P[o.id])P[o.id].alive=0;(o.team?S.oink:S.cluck)(.6)}
  else if(o.t==='left'&&P[o.id]){sc.remove(P[o.id].g);if(P[o.id].cm)sc.remove(P[o.id].cm);delete P[o.id]}}}
net();

// ---------- ввод ----------
const isT='ontouchstart' in window||navigator.maxTouchPoints>0;let jx=0,jy=0,jid=null,lid=null,jo,lp;
if(isT){document.body.classList.add('t');$('hint').innerHTML='Поверни телефон горизонтально 📱<br>Левый палец – ходьба · правый – обзор · 🔫 огонь · ⤒ прыжок · 🍾 аптечка (5 бутылок СПИРТ) · 🚗 купить/сесть в машину'}
addEventListener('touchstart',e=>{if(!locked)return;for(const t of e.changedTouches){if(t.target.classList.contains('tb')||t.target.id==='mu')continue;
 if(t.clientX<innerWidth/2&&jid===null){jid=t.identifier;jo=[t.clientX,t.clientY];const q=$('jr').style;q.display='block';q.left=t.clientX-50+'px';q.top=t.clientY-50+'px';$('jk').style.transform='none'}
 else if(lid===null){lid=t.identifier;lp=[t.clientX,t.clientY]}}},{passive:false});

    else if(r<.65){let bq=4900,bg=null;for(const g of bots_){const q=(g.position.x-p.x)**2+(g.position.z-p.z)**2;if(q<bq){bq=q;bg=g}}if(bg)w=[bg.position.x,bg.position.z]}
    else if(tg&&r<.85){const q=tg===me?me:tg.g.position;w=[q.x,q.z]}
    b.wp=w||rp()}
   const dx=b.wp[0]-p.x,dz=b.wp[1]-p.z,d=Math.hypot(dx,dz)||1;vx=dx/d;vz=dz/d;b.g.rotation.y=Math.atan2(-dx,-dz);
   if(b.car&&Math.hypot(b.car.x-p.x,b.car.z-p.z)<4&&Math.hypot(b.wp[0]-b.car.x,b.wp[1]-b.car.z)<4){b.mode='drive';b.dt=25+R()*20;b.g.visible=false;b.wp=null;continue}
  }
  if(b.av>0){const t=vx;vx=-vz*b.ad;vz=t*b.ad}// упёрся – обходит
  p.x+=vx*4.5*dt;p.z+=vz*4.5*dt;col(p);p.y=(vx||vz)?Math.abs(Math.sin(tm*9+b.ph))*.07:0;
  if((b.lt-=dt)<=0){b.lt=.7;if((vx||vz)&&Math.hypot(p.x-b.lx,p.z-b.lz)<.6){b.wp=null;b.av=.9;b.ad=R()<.5?1:-1}b.lx=p.x;b.lz=p.z}
  for(const g of bots_)if(Math.abs(g.position.x-p.x)<1.6&&Math.abs(g.position.z-p.z)<1.6){b.b++;const[x,z]=rp();g.position.x=x;g.position.z=z}
  if(b.b>=50&&!b.car)for(const d of DL)if(Math.hypot(p.x-d.x,p.z-DZ)<5){botBuy(b,d);break}
 }}

 if((me.sent-=dt)<=0){me.sent=.05;send({t:'p',team:me.team,x:+me.x.toFixed(2),y:+me.y.toFixed(2),z:+me.z.toFixed(2),r:+me.yaw.toFixed(2),a:me.dead?0:1,v:me.drv?1:0,c:car.own?[+car.x.toFixed(1),+car.z.toFixed(1),+car.r.toFixed(2),car.type==='vaz'?1:0]:0})}
 for(const e of Object.values(P)){const p=e.g.position,k=Math.min(1,dt*12);p.x+=(e.tx-p.x)*k;p.y+=(e.ty-p.y)*k;p.z+=(e.tz-p.z)*k;e.g.rotation.y=e.r;e.g.visible=!!e.alive&&!e.v;if(e.c){if(!e.cm){e.cm=carMesh(e.c[3]?'vaz':'mondeo');sc.add(e.cm);e.cm.position.set(e.c[0],0,e.c[1])}const q=e.cm.position,kk=Math.min(1,dt*10);q.x+=(e.c[0]-q.x)*kk;q.z+=(e.c[1]-q.z)*kk;e.cm.rotation.y=e.c[2]}else if(e.cm){sc.remove(e.cm);e.cm=null}}

 for(let i=tr.length-1;i>=0;i--){if((tr[i][1]-=dt)<=0){sc.remove(tr[i][0]);tr[i][0].geometry.dispose();tr.splice(i,1)}}
